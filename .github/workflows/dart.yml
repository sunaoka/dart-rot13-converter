name: Dart

on:
  pull_request:
    branches: [ develop ]

  push:
    branches: [ develop ]

  schedule:
    - cron: '23 1 * * *'

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        sdk: [ '2.12.0', stable ]
        exclude:
          - os: macos-latest
            sdk: '2.12.0'

    name: ${{ matrix.os }} - ${{ matrix.sdk }}

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_seconds: 30
          max_attempts: 3
          command: dart pub get

      - name: dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: analyzer
        run: dart analyze --fatal-infos --fatal-warnings .

      - name: run test
        run: dart run test . --coverage=coverage

      - name: coverage
        run: dart run coverage:format_coverage --lcov --packages=.dart_tool/package_config.json --in coverage --out lcov.info

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
        if: matrix.os == 'ubuntu-latest' && matrix.sdk == 'stable'
